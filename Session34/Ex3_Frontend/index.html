<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex3_Session34</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body style="height: 100vh;" class="d-flex align-items-center justify-content-center shadow-lg p-3 bg-light">
    <div class="login-form form-control w-50">
        <h2 class="text-center mb-4 mt-5">Login</h2>
        <form class="mx-5">
          <div class="mb-3">
            <label for="email" class="form-label">Email: </label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password: </label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
          </div>
          <div class="text-danger" id="mistake"></div>
          <button type="button" class="btn btn-primary w-100 mb-3" onclick = "checkOutAndLogin()">Login</button>
          <div class="other mb-5 d-flex justify-content-between">
            <div class="text-primary" id="forgot" onclick="forgotPass()">Forgot password?</div>
            <p>or</p>
            <div class="text-primary" id="signUp"  onclick="location.href= '../Ex1_Frontend/index.html' ">SignUp</div>
            <!-- <div class="text-primary" id="signUp">SignUp</div> -->
          </div>
        </form>
    </div>

    <script src="./index.js"></script>
    <script src=""></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex2_Session34</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        .table-shadow {
          box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center">Task Management</h2>
        <div class="row">
            <div class="col">
              <input type="text" class="form-control" placeholder="Content" id="content">
            </div>
            <div class="col">
              <input type="date" class="form-control" id="date">
            </div>
            <div class="col">
              <select name="" class="form-select" id="status">
                <option value="Choose status" disabled selected>Choose status</option>
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
            <div class="col">
              <input type="text" class="form-control" placeholder="Username" id="username">
            </div>
            <div class="col">
                <button class="btn btn-primary" onclick="addTask()">Submit</button>
            </div>
        </div>
        <table class="table mt-5 table-shadow">
            <thead class="table-secondary">
              <tr>
                <th scope="col">#</th>
                <th scope="col">Content</th>
                <th scope="col">Due date</th>
                <th scope="col">Status</th>
                <th scope="col">Assigned to</th>
                <th scope="col" colspan="2">Action</th>
              </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Edit box</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <div class="col mt-3">
                  <input type="text" class="form-control" placeholder="Content" id="edit-content">
                </div>
                <div class="col mt-3">
                  <input type="date" class="form-control" id="edit-date">
                </div>
                <div class="col mt-3">
                  <select name="" class="form-select" id="edit-status">
                    <option value="Choose status" disabled selected>Choose status</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                  </select>
                </div>
                <div class="col mt-3">
                  <input type="text" class="form-control" placeholder="Username" id="edit-username">
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="save-changes-btn" onclick="saveChange()">Save changes</button>
              </div>
            </div>
          </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="./index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex5_Session34</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h2 class="text-center">Danh sách nhân viên</h2>
        <input type="text" class="form-control" placeholder="Thêm tên nhân viên..." id="employeeName">
        <input type="text" class="form-control mt-3" placeholder="Thêm chức vụ..." id="employeePosition">
        <button type="button" class="btn btn-success mt-3" id="add-btn">Thêm</button>
        <table class="table mt-5">
            <thead>
                <tr>
                    <th>Tên</th>
                    <th>Chức vụ</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script>
        let employees = JSON.parse(localStorage.getItem("employees")) || [];

        const renderList = function() {
            let html = "";
            employees.forEach(employee => {
                html += `<tr>
                            <td>${employee.name}</td>
                            <td>${employee.position}</td>
                            <td><button class="btn btn-danger del-btn" data-name="${employee.name}">Xóa</button></td>
                         </tr>`;
            });
            document.getElementById("table-body").innerHTML = html;
            localStorage.setItem("employees", JSON.stringify(employees));
        };

        renderList();

        document.getElementById("add-btn").addEventListener("click", () => {
            let name = document.getElementById("employeeName").value;
            let position = document.getElementById("employeePosition").value;

            if (name && position) {
                employees.push({ name: name, position: position });
                renderList();
                document.getElementById("employeeName").value = "";
                document.getElementById("employeePosition").value = "";
            }
        });

        document.getElementById("table-body").addEventListener("click", function(event) {
            if (event.target.classList.contains("del-btn")) {
                let name = event.target.getAttribute("data-name");
                employees = employees.filter(employee => employee.name !== name);
                renderList();
            }
        });
    </script>
</body>
</html>

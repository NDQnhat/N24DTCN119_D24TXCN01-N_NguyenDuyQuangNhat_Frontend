<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex8_Session12</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <div class="container">
        <h3>Payment</h3>
        <form class="row g-3">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
                <label class="form-check-label" for="flexRadioDefault1">
                    Credit card
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
                <label class="form-check-label" for="flexRadioDefault2">
                    Debit card
                </label>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault3" checked>
                <label class="form-check-label" for="flexRadioDefault3">
                    Paypal
                </label>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <label for="">Name on card</label>
                    <input type="text" class="form-control" />
                    <div id="emailHelp" class="form-text">Fullname as display on card.</div>
                </div>
                <div class="col">
                    <label for="">Credit card number</label>
                    <input type="text" class="form-control" />
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-md-3">
                    <label for="">Expiration</label>
                    <input type="text" class="form-control" />
                </div>
                <div class="col-md-3 mb-4">
                    <label for="">CVV</label>
                    <input type="text" class="form-control" />
                </div>
                <hr />
            </div>
            <button type="button" class="btn btn-primary">Continue to checkout</button>
        </form>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

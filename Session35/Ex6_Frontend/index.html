<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex6_Session35</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.7.2/css/all.css">
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between">
            <h4>Danh mục</h4>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">Thêm mới danh mục</button>
        </div>
        <div class="d-flex justify-content-end gap-3 mt-3">
            <select name="" id="status" class="form-select w-25">
                <option value="Đang hoạt động">Đang hoạt động</option>
                <option value="Ngừng hoạt động">Ngừng hoạt động</option>
            </select>
            <input type="text" class="form-control w-25" placeholder="Tìm kiếm danh mục theo tên">
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Mã danh mục</th>
                    <th scope="col">Tên danh mục</th>
                    <th scope="col">Trạng thái</th>
                    <th scope="col">Chức năng</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">Thêm mới danh mục</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <label for="category-id">Mã danh mục</label><br>
                <input type="text" class="form-control" id="category-id">
                <p class="d-none" id="checkId">Mã danh mục không được để trống</p>
                <label for="category-name" class="mt-3">Tên danh mục</label>
                <input type="text" class="form-control" id="category-name">
                <p class="d-none" id="checkName">Tên danh mục không được để trống</p>
                <label for="" class="fw-bold my-3">Trạng thái</label><br>
                <input type="radio" name="status" value="Đang hoạt động">
                <label for="status">Đang hoạt động</label>
                <input type="radio" name="status" value="Ngừng hoạt động">
                <label for="status">Ngừng hoạt động</label>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="button" id="close-modal" class="btn btn-primary" onclick="addCategory()">Add</button>
            </div>
          </div>
        </div>
    </div>

    <script src="./index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>

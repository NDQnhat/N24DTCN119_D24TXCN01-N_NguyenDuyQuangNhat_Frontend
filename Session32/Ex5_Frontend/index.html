<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex5_Session32</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">To-Do List K24_PTIT</h1>
        <div class="d-flex justify-content-center mb-3">
            <input type="text" id="input" class="form-control w-50" placeholder="Nhập nhiệm vụ...">
            <button id="addTodo" class="btn btn-success ms-3">Thêm</button>
        </div>
        <ul id="taskList" class="list-group"></ul>
    </div>

    <script>
        let ul = document.getElementById("taskList");
        let input = document.getElementById("input");
        let addTodo = document.getElementById("addTodo");
        let tasks = [];
        addTodo.addEventListener("click", function() {
            let task = input.value;
            if (task) {
                let li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center";
                li.innerHTML = `${task} <button class="btn btn-danger btn-sm ms-3">X</button>`;
                ul.appendChild(li);
                tasks.push(task);
                input.value = "";
            }
        });

        ul.addEventListener("click", function(event) {
            if (event.target.tagName === "button") {
                let li = event.target.parentElement;
                let task = li.firstChild.textContent;
                tasks = tasks.filter(t => t !== task);
                ul.removeChild(li);
            }
        });
        
    </script>
</body>
</html>

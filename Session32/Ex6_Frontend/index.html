<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex6_Session32</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .btn-container {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            /* font-size: 16px; */
            cursor: pointer;
            border-radius: 5px;
            border: none;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <p id="text">Chữ sẽ thay đổi kích thước khi bấm nút</p>
        <div class="btn-container">
            <button id="btn-plus">+</button>
            <button id="btn-neg">-</button>
        </div>
    </div>

    <script>
        let text = document.getElementById("text");
        let btnPlus = document.getElementById("btn-plus");
        btnPlus.style.backgroundColor = "green";
        let btnNeg = document.getElementById("btn-neg");
        btnNeg.style.backgroundColor = "red";
        let fontSize = 16;
        text.style.fontSize = fontSize + "px";
        btnPlus.addEventListener("click", function() {
            fontSize += 2;
            text.style.fontSize = fontSize + "px";
        });
        btnNeg.addEventListener("click", function() {
            fontSize -= 2;
            text.style.fontSize = fontSize + "px";
        });
    </script>
</body>
</html>

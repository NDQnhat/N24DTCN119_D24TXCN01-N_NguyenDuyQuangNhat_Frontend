<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex1_Session36</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container vh-100 d-flex flex-column justify-content-center align-items-center" id="input">
        <div class="form text-center rounded shadow p-4 bg-white w-50">
            <h3 class="mb-4 fw-bold">Nhập tên của bạn</h3>
            <div class="wrapper d-flex flex-row justify-content-center align-items-center gap-3">
                <input type="text" id="name" class="form-control w-50" placeholder="Nhập tên của bạn">
                <button class="btn btn-primary px-4" id="save-btn">Lưu</button> 
            </div>
        </div>
    </div>
    <div class="container vh-100 flex-column justify-content-center align-items-center d-none" id="hello">
        <div class="form text-center rounded shadow p-4 bg-white w-50">
            <h3 class="mb-4 fw-bold">👋Chào bạn, <span id="your-name"></span></h3>
            <button id="rename" class="btn btn-primary px-3">Đổi tên</button>
        </div>
    </div>

    <script src="./index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>

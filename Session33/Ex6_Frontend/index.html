<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex6_Session33</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        
    </style>
</head>
<body>
    <div class="container d-flex flex-column align-items-center vh-100 gap-3">
        <h1 class="text-center">Ứng dụng Thời tiết</h1>
        <div class="input-group mb-3 w-50">
            <input type="text" class="form-control" id="cityInput" placeholder="Nhập tên thành phố" value="Hồ Chí Minh">
            <button class="btn btn-primary" type="button" id="btn">Tìm kiếm</button>
        </div>
        <section class="card w-50 shadow" id="weatherCard">
            <div class="card-body text-center d-flex flex-column align-items-start">
                <h3 id="city" class="card-title fw-bold">Hồ Chí Minh</h3>
                <div class="info my-3 d-flex align-items-center gap-5">
                    <p id="icon" class="display-1">☀️</p>
                    <h2 class="card-subtitle mb-2 display-1"><span id="temperature" class="">32</span>°C</h2>
                    <div id="description" class="d-flex flex-column align-items-start">
                        <p id="weather">Nắng</p>
                        <p>Độ ẩm: <span id="humidity">75</span>%</p>
                        <p>Tốc độ gió: <span id="windSpeed">7</span>km/h</p>
                    </div>
                </div>
            </div>
        </section>
    </div>


    <script src="./index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
